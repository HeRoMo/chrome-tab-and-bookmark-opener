name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.tool-versions'

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
